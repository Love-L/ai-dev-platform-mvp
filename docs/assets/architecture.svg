<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 656" width="1000" height="656" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrBoth" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrOut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1000" height="656" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="500" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">系统架构：分层解耦，出站可审计</text>
  <text x="500" y="66" text-anchor="middle" font-size="14" fill="#64748b">UI ↔ IPC ↔ 命令 ↔ 服务 ↔ 存储，每一层职责单一</text>

  <!-- L1 UI -->
  <rect x="30" y="96" width="610" height="104" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="48" y="126" font-size="15" font-weight="700" fill="#1e40af">UI 层 · React 19 + Zustand</text>
  <g font-size="12" fill="#1e3a8a">
    <rect x="48" y="146" width="106" height="34" rx="8" fill="#ffffff" stroke="#dbeafe"/>
    <text x="101" y="167" text-anchor="middle">工作台</text>
    <rect x="164" y="146" width="106" height="34" rx="8" fill="#ffffff" stroke="#dbeafe"/>
    <text x="217" y="167" text-anchor="middle">需求 · 看板</text>
    <rect x="280" y="146" width="106" height="34" rx="8" fill="#ffffff" stroke="#dbeafe"/>
    <text x="333" y="167" text-anchor="middle">会话终端</text>
    <rect x="396" y="146" width="106" height="34" rx="8" fill="#ffffff" stroke="#dbeafe"/>
    <text x="449" y="167" text-anchor="middle">统计 · 监控</text>
    <rect x="512" y="146" width="110" height="34" rx="8" fill="#ffffff" stroke="#dbeafe"/>
    <text x="567" y="167" text-anchor="middle">系统设置</text>
  </g>

  <line x1="335" y1="204" x2="335" y2="222" stroke="#64748b" stroke-width="2" marker-end="url(#arrBoth)"/>

  <!-- IPC -->
  <rect x="30" y="232" width="610" height="56" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="48" y="258" font-size="15" font-weight="700" fill="#6d28d9">Tauri IPC 边界</text>
  <text x="48" y="278" font-size="12.5" fill="#5b21b6">101 commands · 结构化错误 {code, message} · invoke 包装层统一规整</text>

  <line x1="335" y1="292" x2="335" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#arrBoth)"/>

  <!-- L2 命令层 -->
  <rect x="30" y="320" width="610" height="76" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="48" y="348" font-size="15" font-weight="700" fill="#1e3a8a">命令层 · commands/（14 个业务域模块）</text>
  <text x="48" y="374" font-size="12.5" fill="#1d4ed8">requirements · tasks · sessions · skills · agents · git · tokens · mcp · pty · …</text>

  <line x1="335" y1="400" x2="335" y2="418" stroke="#64748b" stroke-width="2" marker-end="url(#arrBoth)"/>

  <!-- L3 服务层 -->
  <rect x="30" y="428" width="610" height="104" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="48" y="456" font-size="15" font-weight="700" fill="#6d28d9">服务层 · services/</text>
  <g font-size="12" fill="#5b21b6">
    <rect x="48" y="470" width="182" height="26" rx="8" fill="#ffffff" stroke="#e9d5ff"/>
    <text x="139" y="487" text-anchor="middle">prd_service</text>
    <rect x="240" y="470" width="182" height="26" rx="8" fill="#ffffff" stroke="#e9d5ff"/>
    <text x="331" y="487" text-anchor="middle">skill_evolution（自进化引擎）</text>
    <rect x="432" y="470" width="190" height="26" rx="8" fill="#ffffff" stroke="#e9d5ff"/>
    <text x="527" y="487" text-anchor="middle">session_driver</text>
    <rect x="48" y="502" width="182" height="26" rx="8" fill="#ffffff" stroke="#e9d5ff"/>
    <text x="139" y="519" text-anchor="middle">git_service</text>
    <rect x="240" y="502" width="182" height="26" rx="8" fill="#ffffff" stroke="#e9d5ff"/>
    <text x="331" y="519" text-anchor="middle">system_monitor</text>
    <rect x="432" y="502" width="190" height="26" rx="8" fill="#ffffff" stroke="#e9d5ff"/>
    <text x="527" y="519" text-anchor="middle">backup_service</text>
  </g>

  <line x1="335" y1="536" x2="335" y2="554" stroke="#64748b" stroke-width="2" marker-end="url(#arrBoth)"/>

  <!-- L4 存储 -->
  <rect x="30" y="564" width="610" height="58" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="48" y="590" font-size="15" font-weight="700" fill="#065f46">存储层（全部在本机）</text>
  <g font-size="12" fill="#047857">
    <text x="48" y="610">SQLite WAL · 迁移框架 v9+</text>
    <text x="250" y="610">keystore（DPAPI + AES-256-GCM）</text>
    <text x="480" y="610">本地文件 · 启动备份</text>
  </g>

  <!-- 出站总线 -->
  <line x1="644" y1="480" x2="660" y2="480" stroke="#2563eb" stroke-width="2"/>
  <line x1="660" y1="188" x2="660" y2="512" stroke="#2563eb" stroke-width="2"/>
  <line x1="660" y1="188" x2="700" y2="188" stroke="#2563eb" stroke-width="2" marker-end="url(#arrOut)"/>
  <line x1="660" y1="296" x2="700" y2="296" stroke="#2563eb" stroke-width="2" marker-end="url(#arrOut)"/>
  <line x1="660" y1="404" x2="700" y2="404" stroke="#2563eb" stroke-width="2" marker-end="url(#arrOut)"/>
  <line x1="660" y1="512" x2="700" y2="512" stroke="#2563eb" stroke-width="2" marker-end="url(#arrOut)"/>

  <!-- 右侧外部依赖 -->
  <rect x="676" y="96" width="294" height="526" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="823" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">外部依赖（显式 · 可审计）</text>

  <rect x="700" y="150" width="246" height="76" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="823" y="180" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e40af">Claude API</text>
  <text x="823" y="202" text-anchor="middle" font-size="12" fill="#1d4ed8">仅 PRD / 字段提示词</text>
  <text x="823" y="218" text-anchor="middle" font-size="12" fill="#1d4ed8">经你自己的 API Key</text>

  <rect x="700" y="258" width="246" height="76" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="823" y="288" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f46">Agent CLI</text>
  <text x="823" y="310" text-anchor="middle" font-size="12" fill="#047857">Claude Code · Codex CLI</text>
  <text x="823" y="326" text-anchor="middle" font-size="12" fill="#047857">在内置 PTY 中承载</text>

  <rect x="700" y="366" width="246" height="76" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="823" y="396" text-anchor="middle" font-size="14.5" font-weight="700" fill="#92400e">Git 仓库</text>
  <text x="823" y="418" text-anchor="middle" font-size="12" fill="#b45309">status · diff · commit · log</text>
  <text x="823" y="434" text-anchor="middle" font-size="12" fill="#b45309">提交归属到任务</text>

  <rect x="700" y="474" width="246" height="76" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="823" y="504" text-anchor="middle" font-size="14.5" font-weight="700" fill="#5b21b6">MCP 端点</text>
  <text x="823" y="526" text-anchor="middle" font-size="12" fill="#6d28d9">按项目绑定</text>
  <text x="823" y="542" text-anchor="middle" font-size="12" fill="#6d28d9">执行日志本地留痕</text>

  <text x="823" y="592" text-anchor="middle" font-size="12.5" fill="#94a3b8">无账号 · 无服务器 · 无遥测</text>
</svg>
