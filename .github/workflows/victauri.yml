# 真后端 E2E（victauri）：在 xvfb 下启动真实 Tauri 应用，
# 跑 victauri smoke + Rust integration 测试（VICTAURI_E2E=1）。
#
# 说明：tests/l3-fullstack 与 tests/l6-ipc 虽名为"全栈/IPC"，但在 vitest 内
# mock 了 invoke，属前端契约层（已在主 CI 的 npm test 中覆盖）；
# **本 workflow 是唯一打到真 SQLite/真 IPC/真窗口的测试链路**。
# Playwright e2e（test:e2e）仅覆盖纯 vite 前端导航，不依赖本链路。

name: Victauri E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libgtk-3-dev libssl-dev xvfb

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-06)
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      - name: Build app
        run: cargo build

      - name: Start app under xvfb
        run: |
          xvfb-run -a ./target/debug/$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[0].name') &
          echo "APP_PID=$!" >> "$GITHUB_ENV"

      - name: Victauri smoke tests
        uses: 4DA-Systems/victauri/.github/actions/victauri-test@v0.8.8
        with:
          check: "true"
          victauri-version: "0.8.8"

      - name: Run integration tests
        run: cargo test --test integration -- --test-threads=1
        env:
          VICTAURI_E2E: "1"

      - name: Cleanup
        if: always()
        run: |
          if [ -n "$APP_PID" ]; then
            kill "$APP_PID" 2>/dev/null || true
          fi
